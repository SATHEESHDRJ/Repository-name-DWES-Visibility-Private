name: DWES CI (local validation)

# LOCAL WORKFLOW VALIDATED when `actionlint` / schema checks pass and jobs are
# runnable via `act` or GitHub Actions. REMOTE CI NOT TESTED until a real remote run exists.
# Do not treat file existence alone as CI/CD PASS.

on:
  push:
    branches: [main, master, 'change/**', 'security/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: dwes-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (selected)
        run: |
          npm run test:endpoint-v2
          npm run test:state
          npm run test:pwa
      - name: Production build
        run: npm run build

  backend:
    name: Backend test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm run build
      - name: Unit tests
        run: npm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root
        run: npm ci
      - name: Audit root (omit dev)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Audit backend (omit dev)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  container-api:
    name: Container build validation (API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t dwes-api:ci .
