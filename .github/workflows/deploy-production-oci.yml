name: Deploy Production OCI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  OCI_REGION: me-dubai-1

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_OCIR_HOST }}
          username: ${{ secrets.OCI_OCIR_USERNAME }}
          password: ${{ secrets.OCI_OCIR_AUTH_TOKEN }}

      - name: Build and push API
        run: |
          docker build -f infra/docker/Dockerfile.api \
            -t ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-api:${{ steps.meta.outputs.tag }} \
            -t ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-api:latest .
          docker push ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-api:${{ steps.meta.outputs.tag }}
          docker push ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-api:latest

      - name: Build and push Nginx
        run: |
          docker build -f infra/docker/Dockerfile.nginx \
            -t ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-nginx:${{ steps.meta.outputs.tag }} \
            -t ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-nginx:latest .
          docker push ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-nginx:${{ steps.meta.outputs.tag }}
          docker push ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-nginx:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Write Bastion SSH key
        env:
          OCI_VM_SSH_KEY: ${{ secrets.OCI_VM_SSH_KEY }}
        run: |
          echo "$OCI_VM_SSH_KEY" > /tmp/dwes_bastion_key
          chmod 600 /tmp/dwes_bastion_key

      - name: Deploy via Bastion
        env:
          OCI_BASTION_ID: ${{ secrets.OCI_BASTION_ID }}
          OCI_VM_INSTANCE_ID: ${{ secrets.OCI_VM_INSTANCE_ID }}
          OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
          OCI_VM_SSH_KEY: /tmp/dwes_bastion_key
          DWES_API_IMAGE: ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-api:${{ needs.build-push.outputs.image_tag }}
          DWES_NGINX_IMAGE: ${{ secrets.OCI_OCIR_HOST }}/${{ secrets.OCI_OCIR_NAMESPACE }}/dwes-nginx:${{ needs.build-push.outputs.image_tag }}
          GIT_REF: ${{ github.ref_name }}
        run: bash infra/oci/scripts/deploy-via-bastion.sh
