      (function () {
        try {
          var M = 'dwes-primary-ingenious-20260717';
          if (!localStorage.getItem(M)) {
            localStorage.setItem(M, '1');
            localStorage.setItem('dwes-theme-reset-default-20260716', '1');
            localStorage.setItem('dwes-app-theme', 'ingenious');
            localStorage.setItem('theme-mode', 'light');
          }
          var t = localStorage.getItem('dwes-app-theme') || 'ingenious';
          if (t === 'arctic' || t === 'harbor' || t === 'graphite') {
            t = 'ingenious';
            localStorage.setItem('dwes-app-theme', t);
          }
          if (t !== 'default' && t !== 'ingenious') t = 'ingenious';
          var m = localStorage.getItem('theme-mode');
          if (m !== 'light' && m !== 'dark') m = 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-mode', m);
          document.documentElement.style.colorScheme = m;
        } catch (e) { /* private mode */ }
      })();
