upstream dwes_api {
  server api:3001 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # `http2` as a listen parameter is deprecated since nginx 1.25.1; use the http2 directive.
  # Ref: nginx.org/en/docs/http/ngx_http_v2_module.html#http2
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  include /etc/nginx/snippets/security-headers.conf;

  client_max_body_size 55m;

  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /api/auth/login {
    limit_req zone=login_limit burst=10 nodelay;
    proxy_pass http://dwes_api;
    include /etc/nginx/proxy_params.conf;
  }

  # Server-Sent Events must be forwarded as they arrive. Buffering or caching this
  # response can make the browser appear connected while delaying live updates.
  location = /api/events/stream {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://dwes_api;
    include /etc/nginx/proxy_params.conf;
    proxy_buffering off;
    proxy_cache off;
  }

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://dwes_api;
    include /etc/nginx/proxy_params.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
