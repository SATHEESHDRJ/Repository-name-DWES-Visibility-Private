upstream dwes_api {
  server api:3001 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

# ── HTTP: unknown / IP → canonical domain (ACME + health preserved) ─────────
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 193.123.79.209 _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://dwes.ingenious-network.com$request_uri;
  }
}

# ── HTTP: official hostname ───────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name dwes.ingenious-network.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://dwes.ingenious-network.com$request_uri;
  }
}

# ── HTTPS: default — do not serve DWES on bare IP (cert is domain-only) ───────
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  ssl_reject_handshake on;
}

# ── HTTPS: official DWES production host ──────────────────────────────────────
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dwes.ingenious-network.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  include /etc/nginx/snippets/security-headers.conf;

  client_max_body_size 55m;

  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /api/auth/login {
    limit_req zone=login_limit burst=10 nodelay;
    proxy_pass http://dwes_api;
    include /etc/nginx/proxy_params.conf;
  }

  location /api/install/validate {
    limit_req zone=install_validate_limit burst=15 nodelay;
    proxy_pass http://dwes_api;
    include /etc/nginx/proxy_params.conf;
  }

  location = /api/events/stream {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://dwes_api;
    include /etc/nginx/proxy_params.conf;
    proxy_buffering off;
    proxy_cache off;
  }

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://dwes_api;
    include /etc/nginx/proxy_params.conf;
  }

  location = /pdf.worker.min.mjs {
    types { }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
