# DWES Postgres 16 — tuned for VM.Standard.A1.Flex 2 OCPU / 12 GB RAM
# Mounted read-only; schema unchanged (WiringSchemeDB read-only via Prisma)

listen_addresses = '*'
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_compression = on
checkpoint_completion_target = 0.9
random_page_cost = 1.1
log_min_duration_statement = 1000
