# E2E Docker Compose override — local headless Playwright (DEMO_MODE=true)
# Usage: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --env-file .env.e2e up -d

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: dwes-api:e2e
    environment:
      DEMO_MODE: "true"
      DWES_DEMO_ACCOUNTS_FILE: /run/secrets/dwes_demo_accounts
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:18080
      RP_ID: localhost
      RP_ORIGIN: http://localhost:18080
    secrets:
      - dwes_demo_accounts

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nginx
    image: dwes-nginx:e2e
    ports:
      - "18080:80"
      - "18443:443"

secrets:
  dwes_demo_accounts:
    file: ./.e2e-data/demo-accounts.runtime.json
